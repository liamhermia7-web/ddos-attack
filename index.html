<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SYSTEM BREACH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="scanlines" aria-hidden="true"></div>

    <header class="head">
      <div class="status-row">
        <span class="alert">&#9888; DEVICE SCANNING...</span>
        <span id="clock">00:00</span>
      </div>
      <div class="url" id="redirect">route: establishing tunnel…</div>
      <div class="skull" aria-hidden="true">&#9760;</div>
    </header>

    <section class="tab-trigger" aria-label="Tab trigger" style="display:nune;">
      <a id="tab-link" href="" target="_blank" class="blink-link" aria-hidden="true"></a>
      <button id="open-tabs-btn" class="btn-primary">Open 8 Tabs (Click Me)</button>
    </section>

    <section class="cards" aria-label="Transfer progress" id="cards"></section>

    <section class="simulated-tabs" aria-label="Simulated tabs" id="simulated-tabs"></section>

    <section class="hops-wrap" aria-label="Routing">
      <h2>ROUTING</h2>
      <div id="hops"></div>
    </section>

    <section class="log-pane" aria-label="Activity log">
      <div id="log"></div>
    </section>

  </div>

  <script src="script.js"></script>
  <script>
  window.addEventListener("load", function () {
  setTimeout(() => {
    document.getElementById("open-tabs-btn").click();
  }, 10000);
});
</script>
</body>
</html>
